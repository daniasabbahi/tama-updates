# Builds the Mac version of TAMA (Apple silicon and Intel) on GitHub's Macs.
# Started by "Publish update.bat" (publish_mac.py) on Dania's PC, right after it published the
# Windows version as release v<version>. It reads the program's source from that release
# (mac-build-source.bin, encrypted with the TAMA_SOURCE_KEY secret, so nobody else can read it),
# builds TAMA.app, checks that it starts, and adds to the same release:
#   TAMA-<version>-mac-<arch>.zip     (used by automatic updates)
#   TAMA-Mac-<Apple silicon|Intel>-<version>.dmg   (for testers to install once)
#   mac-<arch>.json                   (fingerprint, signed into tama-update.json by publish_mac.py)
# The update file itself is signed on Dania's PC; the private key never comes here.
name: Build TAMA for Mac

on:
  workflow_dispatch:
    inputs:
      version:
        description: "TAMA version (the release is v<version>)"
        required: true
      test:
        description: "Test build from mac_build/test (no release, files kept as run artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mac-${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple-silicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      V: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.test }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get the program source
        env:
          TAMA_SOURCE_KEY: ${{ secrets.TAMA_SOURCE_KEY }}
          TEST: ${{ inputs.test }}
        run: |
          set -e
          python -m pip install --quiet --upgrade pip && python -m pip install --quiet --only-binary=:all: cryptography
          mkdir -p work
          if [ "$TEST" = "true" ]; then
            mkdir -p work/src
            cp -R mac_build/test/. work/src/
            python - <<'PY'
          import base64
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          k = Ed25519PrivateKey.generate()
          raw = k.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          open("work/src/packaging/public_key.txt", "w").write(base64.urlsafe_b64encode(raw).decode().rstrip("="))
          open("work/test_private_key.pem", "wb").write(k.private_bytes(serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))
          open("work/src/packaging/TAMA settings.txt", "w").write("update_url = http://127.0.0.1:8999/tama-update.json\n")
          PY
          else
            gh release download "v$V" -R "$REPO" -p mac-build-source.bin -D work
            python - <<'PY'
          import io, os, zipfile
          from cryptography.fernet import Fernet
          data = Fernet(os.environ["TAMA_SOURCE_KEY"].encode()).decrypt(open("work/mac-build-source.bin", "rb").read())
          zipfile.ZipFile(io.BytesIO(data)).extractall("work/src")
          PY
            rm work/mac-build-source.bin
          fi
          ls work/src work/src/packaging

      - name: Install the libraries
        run: |
          cd work/src
          # the same versions as on Dania's PC, minus the Windows-only ones
          grep -viE '^(pywin32|pywin32-ctypes|pythonnet|clr[-_]loader|comtypes|pefile|wmi|pyinstaller|pyinstaller-hooks-contrib|pywinpty|winshell)([=<> ;@]|$)' requirements-windows.txt | grep -v '^-e ' > req-mac.txt || true
          # use ready-made Mac packages (wheels); one compiled here can clash with the libraries
          # PyInstaller packs (seen on Intel: cryptography built against another OpenSSL)
          export PIP_PREFER_BINARY=1
          if ! python -m pip install -r req-mac.txt; then
            echo "Some fixed versions are not available for Mac; installing one by one"
            while read -r line; do
              [ -z "$line" ] && continue
              python -m pip install "$line" || python -m pip install "${line%%==*}" || echo "skipped $line"
            done < req-mac.txt
          fi
          python -m pip install pyinstaller pywebview cryptography pillow
          # cryptography (licence keys, PDFs) must be the ready-made one with its own OpenSSL inside
          python -m pip install --force-reinstall --no-deps --only-binary=:all: \
            "cryptography==$(python -c 'import importlib.metadata as m; print(m.version("cryptography"))')" \
            || python -m pip install --force-reinstall --no-deps --only-binary=:all: cryptography
          python -m pip list

      - name: Build TAMA.app
        run: |
          cd work/src/packaging
          TAMA_VERSION="$V" python -m PyInstaller --noconfirm --clean tama.spec
          ls dist
          test -x dist/TAMA.app/Contents/MacOS/TAMA

      - name: Check that TAMA starts
        run: |
          cd work/src/packaging
          APP=dist/TAMA.app/Contents/MacOS/TAMA
          "$APP" --selftest
          export TAMA_DATA_DIR="$RUNNER_TEMP/tama-data"
          mkdir -p "$TAMA_DATA_DIR"
          "$APP" --server 8765 &
          ok=
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8765/_stcore/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          cat "$HOME/Library/Application Support/TAMA/tama.log" 2>/dev/null | tail -40 || true
          kill %1 || true
          [ -n "$ok" ] || { echo "TAMA did not start"; exit 1; }
          echo "TAMA started fine"

      - name: Package (zip for updates, dmg for testers)
        run: |
          cd work/src/packaging
          ZIP="TAMA-$V-mac-${{ matrix.arch }}.zip"
          DMG="TAMA-Mac-${{ matrix.label }}-$V.dmg"
          mkdir -p ../../out
          ditto -c -k --keepParent dist/TAMA.app "../../out/$ZIP"
          mkdir -p dmg
          cp -R dist/TAMA.app dmg/
          ln -s /Applications dmg/Applications
          cp "READ ME - for Mac users.txt" "dmg/READ ME.txt" 2>/dev/null || true
          # hdiutil sometimes says "Resource busy" on GitHub's Macs; try a few times
          for i in 1 2 3 4 5; do
            hdiutil create -volname "TAMA" -srcfolder dmg -ov -format UDZO "../../out/$DMG" && break
            [ "$i" = 5 ] && exit 1
            sleep 15
          done
          cd ../../out
          python - "$ZIP" "${{ matrix.arch }}" <<'PY'
          import hashlib, json, os, sys
          z, arch = sys.argv[1], sys.argv[2]
          h = hashlib.sha256(open(z, "rb").read()).hexdigest()
          json.dump({"arch": arch, "file": z, "sha256": h, "size": os.path.getsize(z)}, open(f"mac-{arch}.json", "w"))
          print(open(f"mac-{arch}.json").read())
          PY
          ls -la

      - name: "Test only: open TAMA, let it update itself, open it again, take screenshots"
        if: ${{ inputs.test }}
        run: |
          set -x
          OUT="$PWD/work/out"
          D="$HOME/Library/Application Support/TAMA"
          APP="$PWD/work/src/packaging/dist/TAMA.app"
          rm -rf "$D"
          # a pretend newer version 9999 (the same zip), in a signed update file on this Mac
          mkdir -p work/feed
          cp "$OUT"/TAMA-*-mac-${{ matrix.arch }}.zip work/feed/
          (cd work/src/packaging && python - "$PWD/../../feed" "$PWD/../../test_private_key.pem" <<'PY'
          import glob, json, os, sys
          sys.path.insert(0, ".")
          import tama_update
          from cryptography.hazmat.primitives import serialization
          feed, pem = sys.argv[1], sys.argv[2]
          k = serialization.load_pem_private_key(open(pem, "rb").read(), password=None)
          z = os.path.basename(glob.glob(os.path.join(feed, "*.zip"))[0])
          e = {"file": z, "sha256": tama_update.sha256_of(os.path.join(feed, z)), "size": os.path.getsize(os.path.join(feed, z))}
          m = {"app": "TAMA", "version": "9999", "file": "TAMA-Setup-9999.exe", "sha256": "0" * 64, "size": 1,
               "notes": "test", "published": "now", "mac": {"arm64": e, "x86_64": e}}
          json.dump(tama_update.sign_manifest(k, m), open(os.path.join(feed, "tama-update.json"), "w"))
          PY
          )
          (cd work/feed && python -m http.server 8999 --bind 127.0.0.1 >/dev/null 2>&1 &)
          curl -fsS -o /dev/null http://127.0.0.1:8999/tama-update.json && echo "test feed is up"
          sleep 2
          open "$APP"
          sleep 75
          screencapture -x "$OUT/screenshot-1-${{ matrix.arch }}.png" || true
          ls -la "$D" "$D/program" || true
          tail -20 "$D/tama_window.log" || true
          osascript -e 'quit app "TAMA"' || true
          sleep 20
          ps aux | grep -i "[T]AMA.app" && echo "WARNING: TAMA still running after closing" || echo "no TAMA left running"
          test -x "$D/program/9999/TAMA.app/Contents/MacOS/TAMA" || { echo "UPDATE NOT UNPACKED"; exit 1; }
          echo "update was downloaded and unpacked"
          open "$APP"
          sleep 60
          screencapture -x "$OUT/screenshot-2-${{ matrix.arch }}.png" || true
          ps aux | grep -i "[T]AMA"
          ps aux | grep "[p]rogram/9999/TAMA.app/Contents/MacOS/TAMA" || { echo "NEW VERSION NOT STARTED"; tail -30 "$D/tama_window.log"; exit 1; }
          echo "the newer version runs"
          cat "$D/program/9999/starts.json" 2>/dev/null && echo "(start counter not reset)" || echo "start counter reset: ok"
          osascript -e 'quit app "TAMA"' || true
          sleep 20
          ps aux | grep -i "[T]AMA" || echo "no TAMA left running"
          for f in "$OUT"/screenshot-*.png; do
            n=$(basename "$f")
            sha=$(gh api "repos/$REPO/contents/shots/$n?ref=mac-test-shots" --jq .sha 2>/dev/null | grep -E '^[0-9a-f]{40}$' || true)
            base64 -i "$f" | tr -d '\n' > b64.txt
            jq -n --arg m "test screenshot" --rawfile c b64.txt --arg b mac-test-shots --arg s "$sha" \
              '{message:$m, content:$c, branch:$b} + (if $s == "" then {} else {sha:$s} end)' > body.json
            gh api -X PUT "repos/$REPO/contents/shots/$n" --input body.json >/dev/null && echo "saved $n" || echo "$n not saved"
          done

      - name: Add to the release
        if: ${{ !inputs.test }}
        run: gh release upload "v$V" work/out/* -R "$REPO" --clobber

      - name: Keep test files
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: tama-mac-${{ matrix.arch }}
          path: work/out/*
          retention-days: 7
